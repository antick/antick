<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-labelledby="title description">
  <title id="title">Pankaj Sanam — @antick</title>
  <desc id="description">A typographic calling card with an orange wireframe orbit.</desc>
  <defs>
    <clipPath id="card">
      <rect width="1100" height="280" rx="8"/>
    </clipPath>
    <ellipse id="orbit" cx="897" cy="150" rx="82" ry="27"/>
  </defs>
  <style>
    .paper { fill: #f3f1eb; }
    .ink { fill: #252823; }
    .muted { fill: #60645b; }
    .rule { stroke: #d6d8ce; }
    .orbit { color: #c95730; }
    @media (max-width: 600px) {
      .name { font-size: 34px; letter-spacing: 2px; }
      .meta, .caption { display: none; }
    }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #191d1b; }
      .ink { fill: #eeeede; }
      .muted { fill: #a5ad9e; }
      .rule { stroke: #384139; }
      .orbit { color: #f58b5c; }
    }
  </style>
  <g clip-path="url(#card)">
    <rect class="paper" width="1100" height="280"/>
    <path class="rule" d="M40 62H1060M40 239H1060M741 24V256" fill="none"/>
    <text class="muted name" x="42" y="43" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="3">@ANTICK</text>
    <text class="muted meta" x="1060" y="43" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">CODE / SYSTEMS / CURIOSITY</text>
    <text class="ink" x="40" y="181" font-family="Georgia, 'Times New Roman', serif" font-size="102" font-weight="400" letter-spacing="-3">Pankaj Sanam</text>
    <path d="M671 169H715V181H671Z" fill="#c95730"/>
    <g class="orbit" fill="none" stroke="currentColor" stroke-width="1.2">
      <use href="#orbit"/>
      <use href="#orbit" transform="rotate(15 897 150)"/>
      <use href="#orbit" transform="rotate(30 897 150)"/>
      <use href="#orbit" transform="rotate(45 897 150)"/>
      <use href="#orbit" transform="rotate(60 897 150)"/>
      <use href="#orbit" transform="rotate(75 897 150)"/>
      <use href="#orbit" transform="rotate(90 897 150)"/>
      <use href="#orbit" transform="rotate(105 897 150)"/>
      <use href="#orbit" transform="rotate(120 897 150)"/>
      <use href="#orbit" transform="rotate(135 897 150)"/>
      <use href="#orbit" transform="rotate(150 897 150)"/>
      <use href="#orbit" transform="rotate(165 897 150)"/>
    </g>
    <circle cx="897" cy="150" r="4" fill="#c95730"/>
    <text class="muted caption" x="42" y="261" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">ENGINEERING &amp; OPEN SOURCE</text>
    <path class="rule" d="M1050 252H1060M1055 247V257"/>
  </g>
</svg>
