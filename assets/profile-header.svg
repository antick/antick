<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Pankaj Sanam</title>
  <desc id="description">Technology lead and product builder who turns useful ideas into focused software</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.52" stop-color="#111A33"/>
      <stop offset="1" stop-color="#15102A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59D7FF"/>
      <stop offset="0.52" stop-color="#9C7CFF"/>
      <stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#D8E2FF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="758" y="70" width="350" height="220" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1005" cy="70" r="260" fill="url(#glowViolet)"/>
  <circle cx="690" cy="325" r="230" fill="url(#glowBlue)"/>

  <g opacity="0.9">
    <circle cx="78" cy="67" r="5" fill="#59D7FF"/>
    <path d="M95 67H146" stroke="#59D7FF" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <text x="160" y="73" fill="#9BA9C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="3">BUILDING WITH INTENT</text>
  </g>

  <text x="72" y="155" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="61" font-weight="750" letter-spacing="-2">Pankaj Sanam</text>
  <rect x="73" y="175" width="468" height="4" rx="2" fill="url(#accent)"/>
  <text x="73" y="216" fill="#C8D3EC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="600" letter-spacing="2">TECHNOLOGY LEAD · PRODUCT BUILDER</text>
  <text x="73" y="263" fill="#98A7C6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Turning useful ideas into focused software,</text>
  <text x="73" y="291" fill="#98A7C6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">from architecture to production.</text>

  <g filter="url(#shadow)">
    <rect x="758" y="70" width="350" height="220" rx="22" fill="#0A0F1E" stroke="#7482A6" stroke-opacity="0.28"/>
    <g clip-path="url(#frameClip)">
      <rect x="758" y="70" width="350" height="46" fill="#121A2E"/>
      <circle cx="785" cy="93" r="5" fill="#FF7B72"/>
      <circle cx="803" cy="93" r="5" fill="#F6C85F"/>
      <circle cx="821" cy="93" r="5" fill="#57D68D"/>
      <text x="852" y="99" fill="#7786A8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">~/ideas/next</text>

      <text x="788" y="152" fill="#59D7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">$</text>
      <text x="812" y="152" fill="#D8E2F8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">understand the problem</text>
      <text x="788" y="191" fill="#9C7CFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">$</text>
      <text x="812" y="191" fill="#D8E2F8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">design the system</text>
      <text x="788" y="230" fill="#FFB86B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">$</text>
      <text x="812" y="230" fill="#D8E2F8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">ship something useful</text>
      <rect x="788" y="255" width="9" height="17" rx="2" fill="#59D7FF" opacity="0.9"/>
    </g>
  </g>

  <circle cx="1112" cy="58" r="4" fill="#FFB86B"/>
  <circle cx="1138" cy="83" r="2.5" fill="#59D7FF"/>
  <circle cx="1122" cy="308" r="3" fill="#9C7CFF"/>
  <path d="M694 72C724 72 740 54 740 31" fill="none" stroke="#59D7FF" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <circle cx="694" cy="72" r="4" fill="#59D7FF"/>
</svg>
