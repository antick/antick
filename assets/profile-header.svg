    .interest-icon { fill: none; stroke: #ef471b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-weight: 400; }
    .small { font-size: 18px; letter-spacing: 1.8px; }
    .step-label { font-size: 14px; letter-spacing: 1.3px; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #181b1d; }
      .ink { fill: #f3f2ed; }
      .text { fill: #e0e3e7; }
      .muted { fill: #a1a9b5; }
      .accent { fill: #ff714a; }
      .dots { fill: #4d5661; }
      .rule { stroke: #626b76; }
      .divider { stroke: #3e454d; }
      .outline, .loop-tip { stroke: #e0e3e7; }
      .icon { stroke: #f3f2ed; }
      .interest-icon { stroke: #ff714a; }
    }
  </style>
