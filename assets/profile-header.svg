  <title id="title">Pankaj Sanam — engineer, open source, writer, explorer</title>
  <desc id="description">Curious mind. Building useful things. Always a work in progress. Idea, build, release, iterate: a little better each time. Interests: tech, books, travel, wellness, spirituality, and life. Find me on X at @aghorism.</desc>
  <style>
    .paper { fill: #faf9f6; }
    .ink { fill: #171918; }
    .text { fill: #363c46; }
    .muted { fill: #858c98; }
    .accent { fill: #ef471b; }
    .dots { fill: #c4c8ce; }
    .rule { fill: none; stroke: #b7bcc4; stroke-width: 1.6; }
    .divider { stroke: #d5d7d9; stroke-width: 1.2; }
