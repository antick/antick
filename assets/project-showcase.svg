    <text x="82" y="151" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="41" font-weight="750">Capsule</text>
    <text x="82" y="181" fill="#A8B4CE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Your AI tools, quietly in view.</text>

    <rect x="82" y="221" width="295" height="173" rx="24" fill="#090E1B" stroke="#7683A4" stroke-opacity="0.25"/>
    <circle cx="124" cy="264" r="20" fill="#15223B" stroke="#59D7FF" stroke-width="3" stroke-dasharray="94 32" transform="rotate(-90 124 264)"/>
    <circle cx="124" cy="318" r="20" fill="#201936" stroke="#9C7CFF" stroke-width="3" stroke-dasharray="72 54" transform="rotate(-90 124 318)"/>
    <circle cx="124" cy="372" r="20" fill="#2A211C" stroke="#FFB86B" stroke-width="3" stroke-dasharray="54 72" transform="rotate(-90 124 372)"/>
    <text x="161" y="259" fill="#E5EAF5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">CODEX</text>
    <rect x="161" y="270" width="174" height="6" rx="3" fill="#23304A"/>
    <rect x="161" y="270" width="137" height="6" rx="3" fill="url(#meter)"/>
    <text x="161" y="313" fill="#E5EAF5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">CLAUDE</text>
    <rect x="161" y="324" width="174" height="6" rx="3" fill="#23304A"/>
    <rect x="161" y="324" width="104" height="6" rx="3" fill="#9C7CFF"/>
    <text x="161" y="367" fill="#E5EAF5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">GROK</text>
    <rect x="161" y="378" width="174" height="6" rx="3" fill="#23304A"/>
    <rect x="161" y="378" width="73" height="6" rx="3" fill="#FFB86B"/>

    <rect x="403" y="203" width="130" height="209" rx="28" fill="#080D18" stroke="#59D7FF" stroke-opacity="0.35"/>
    <rect x="422" y="229" width="92" height="29" rx="14.5" fill="#15223B"/>
    <circle cx="440" cy="243.5" r="6" fill="#59D7FF"/>
    <rect x="452" y="239.5" width="43" height="8" rx="4" fill="#485875"/>
    <rect x="422" y="270" width="92" height="29" rx="14.5" fill="#201936"/>
    <circle cx="440" cy="284.5" r="6" fill="#9C7CFF"/>
    <rect x="452" y="280.5" width="34" height="8" rx="4" fill="#55466F"/>
    <rect x="422" y="311" width="92" height="29" rx="14.5" fill="#2A211C"/>
    <circle cx="440" cy="325.5" r="6" fill="#FFB86B"/>
    <rect x="452" y="321.5" width="49" height="8" rx="4" fill="#655344"/>
    <path d="M451 373H485" stroke="#59D7FF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="654" y="75" width="119" height="27" rx="13.5" fill="#725C3B" fill-opacity="0.12" stroke="#725C3B" stroke-opacity="0.3"/>
    <text x="713.5" y="94" fill="#725C3B" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ASTRO THEME</text>
    <text x="654" y="151" fill="#29251E" font-family="Georgia, ui-serif, serif" font-size="41" font-weight="700">Paperline</text>
    <text x="654" y="181" fill="#6C6252" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">An editorial home for thoughtful writing.</text>

    <rect x="654" y="221" width="464" height="193" rx="8" fill="#FFFCF5" stroke="#A9987A" stroke-opacity="0.35"/>
    <rect x="678" y="245" width="112" height="7" rx="3.5" fill="#332E27"/>
