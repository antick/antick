<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Selected projects</title>
  <desc id="description">Visual cards for Capsule and Paperline</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F8FC"/>
      <stop offset="1" stop-color="#EEF1F8"/>
    </linearGradient>
    <linearGradient id="capsuleCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111A31"/>
      <stop offset="1" stop-color="#15102A"/>
    </linearGradient>
    <linearGradient id="paperCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5EEDA"/>
      <stop offset="1" stop-color="#E8DAC0"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59D7FF"/>
      <stop offset="1" stop-color="#9C7CFF"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1E293B" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7C8CAF" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="500" rx="30" fill="url(#canvas)"/>
  <rect width="1200" height="500" rx="30" fill="url(#dots)"/>

  <g filter="url(#cardShadow)">
    <rect x="48" y="42" width="532" height="416" rx="28" fill="url(#capsuleCard)"/>
    <rect x="620" y="42" width="532" height="416" rx="28" fill="url(#paperCard)"/>
  </g>

  <g>
